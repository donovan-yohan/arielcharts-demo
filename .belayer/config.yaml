# .belayer/config.yaml — runtime + sandbox configuration for this project.
# Generated by 'belayer init'. Edit freely; belayer reads this on every run.

# Sandbox driver. The 'noop' driver runs agents in the host environment with
# no isolation. Switch to 'clamshell' (or another registered driver) and
# point 'policy' at a file under .belayer/policies/ to enable isolation.
#
# sandbox:
#   mode: clamshell
#   policy: .belayer/policies/standard.yaml

# Runtime hooks. Belayer can bring an integration environment up/down around
# a run (e.g. workbench services). When omitted, runs do not provision an
# environment — agents work directly against whatever is already running.
#
# runtime:
#   up: ./scripts/workbench-up.sh
#   health: ./scripts/workbench-health.sh
#   down: ./scripts/workbench-down.sh
#   endpoints:
#     - name: api
#       url: http://localhost:8080
